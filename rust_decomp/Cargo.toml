[package]
name = "rust_decomp"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_decomp"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module"] }
numpy = "0.27"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
simba = "0.9"
lapack = "0.19"
num-complex = { version = "0.4", features = ["serde"] }
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }

# BLAS/LAPACK backend, selected per OS so the extension builds everywhere:
#   macOS  -> Apple Accelerate (system framework; works on Apple Silicon)
#   else   -> Intel MKL (prebuilt static download; no system BLAS or Fortran
#             toolchain needed, so it builds on Linux and Windows CI runners)
[target.'cfg(target_os = "macos")'.dependencies]
lapack-src = { version = "0.10", features = ["accelerate"] }
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
lapack-src = { version = "0.10", features = ["intel-mkl"] }
blas-src = { version = "0.10", features = ["intel-mkl"] }
# Link MKL statically (downloaded prebuilt) so the .pyd/.so has no runtime DLL
# dependency — otherwise Windows fails import with "DLL load failed".
intel-mkl-src = { version = "0.8.1", default-features = false, features = ["mkl-static-lp64-seq", "download"] }

[profile.release]
opt-level = 3
lto = "thin"
